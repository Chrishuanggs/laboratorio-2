<section>
    <form>
        <input type="text" placeholder="Filtrar por ciudad" #filtro>
        <button class="primary" type="button" (click)="filterResults(filtro.value)">Search</button>
    </form>
</section>

<section class="results">

    @for (housingLocation of filteredLocationList; track $index) {
        <app-housing-location [housingLocation]="housingLocation" />
    }

</section>
