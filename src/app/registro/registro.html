<section class="max-w-sm mx-auto mt-10 bg-white border border-gray-200 rounded-lg shadow p-6">
    <h1 class="text-2xl font-bold mb-4">Registro</h1>

    @if (error()) {
        <p class="bg-red-100 text-red-700 p-2 rounded mb-4">{{ error() }}</p>
    }
    @if (mensaje()) {
        <p class="bg-green-100 text-green-700 p-2 rounded mb-4">
            {{ mensaje() }} <a routerLink="/login" class="underline">Ir al inicio de sesión</a>
        </p>
    }

    <form [formGroup]="registroForm" (submit)="registrar()" class="flex flex-col gap-3">
        <label for="username">Usuario</label>
        <input id="username" type="text" formControlName="username" class="border rounded p-2" />

        <label for="email">Correo</label>
        <input id="email" type="email" formControlName="email" class="border rounded p-2" />

        <label for="nombre">Nombre</label>
        <input id="nombre" type="text" formControlName="nombre" class="border rounded p-2" />

        <label for="apellido">Apellido</label>
        <input id="apellido" type="text" formControlName="apellido" class="border rounded p-2" />

        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password" class="border rounded p-2" />

        <button type="submit" class="bg-indigo-600 text-white rounded p-2 mt-2 hover:bg-indigo-700">Registrarse</button>
    </form>

    <p class="mt-4 text-sm">¿Ya tiene cuenta? <a routerLink="/login" class="text-indigo-600 underline">Iniciar sesión</a></p>
</section>
