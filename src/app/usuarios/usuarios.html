<section>
    <h1 class="text-2xl font-bold mb-4">Usuarios registrados</h1>

    @if (error()) {
        <p class="bg-red-100 text-red-700 p-2 rounded mb-4">{{ error() }}</p>
    }

    <table class="w-full border border-gray-200 bg-white">
        <thead class="bg-gray-100 text-left">
            <tr>
                <th class="p-2">Usuario</th>
                <th class="p-2">Nombre</th>
                <th class="p-2">Apellido</th>
                <th class="p-2">Correo</th>
            </tr>
        </thead>
        <tbody>
            @for (usuario of usuarios(); track usuario.id) {
                <tr class="border-t border-gray-200">
                    <td class="p-2">{{ usuario.username }}</td>
                    <td class="p-2">{{ usuario.firstName }}</td>
                    <td class="p-2">{{ usuario.lastName }}</td>
                    <td class="p-2">{{ usuario.email }}</td>
                </tr>
            } @empty {
                <tr>
                    <td colspan="4" class="p-2 text-center text-gray-500">No hay usuarios registrados</td>
                </tr>
            }
        </tbody>
    </table>
</section>
