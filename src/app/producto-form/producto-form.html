<section class="max-w-md mx-auto bg-white border border-gray-200 rounded-lg shadow p-6">
    <h1 class="text-2xl font-bold mb-4">{{ id ? 'Editar producto' : 'Nuevo producto' }}</h1>

    @if (error()) {
        <p class="bg-red-100 text-red-700 p-2 rounded mb-4">{{ error() }}</p>
    }

    <form [formGroup]="productoForm" (submit)="guardar()" class="flex flex-col gap-3">
        <label for="nombre">Nombre</label>
        <input id="nombre" type="text" formControlName="nombre" class="border rounded p-2" />

        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" formControlName="descripcion" rows="3" class="border rounded p-2"></textarea>

        <label for="precio">Precio</label>
        <input id="precio" type="number" min="0" step="0.01" formControlName="precio" class="border rounded p-2" />

        <label for="cantidadStock">Cantidad en stock</label>
        <input id="cantidadStock" type="number" min="0" step="1" formControlName="cantidadStock" class="border rounded p-2" />

        <label for="categoriaId">Categoría</label>
        <select id="categoriaId" formControlName="categoriaId" class="border rounded p-2">
            <option [ngValue]="null" disabled>Seleccione una categoría</option>
            @for (categoria of categorias(); track categoria.id) {
                <option [ngValue]="categoria.id">{{ categoria.nombre }}</option>
            }
        </select>

        <div class="flex gap-2 mt-2">
            <button type="submit" class="bg-indigo-600 text-white rounded px-4 py-2 hover:bg-indigo-700">Guardar</button>
            <a routerLink="/productos" class="bg-gray-300 rounded px-4 py-2 hover:bg-gray-400">Cancelar</a>
        </div>
    </form>
</section>
